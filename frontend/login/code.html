<body class="bg-surface min-h-screen flex relative overflow-hidden transition-all">
<div class="w-full lg:w-1/2 flex items-center justify-center p-8 relative overflow-hidden bg-surface">

<p class="font-body-md text-body-md text-on-surface-variant mt-2">Sua jornada de aprendizado começa aqui.</p>
</div>
<div class="glass-panel rounded-xl shadow-lg p-padding-card">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-6 text-center">Bem-vindo(a) de volta!</h2>
<form action="#" class="space-y-gap-md" id="loginForm" method="POST">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-1" for="email">E-mail ou Matrícula</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="person">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-slate-100 border-none rounded-lg focus:ring-2 focus:ring-primary focus:bg-white transition-colors duration-200 font-body-md text-body-md text-on-surface focus:ring-indigo-500 transition-all" id="email" name="email" placeholder="Digite seu e-mail ou matrícula" required="" type="text">
</div>
</div>
<div>
<div class="flex items-center justify-between mb-1">
<label class="block font-label-md text-label-md text-on-surface-variant" for="password">Senha</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors hover:underline decoration-2 underline-offset-4" href="#">Esqueci minha senha</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-slate-100 border-none rounded-lg focus:ring-2 focus:ring-primary focus:bg-white transition-colors duration-200 font-body-md text-body-md text-on-surface focus:ring-indigo-500 transition-all" id="password" name="password" placeholder="Sua senha secreta" required="" type="password">
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex items-center mt-4">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline rounded" id="remember-me" name="remember-me" type="checkbox">
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant" for="remember-me">
                                    Lembrar-me neste dispositivo
                                </label>
</div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-headline-sm text-headline-sm text-on-primary bg-primary hover:bg-primary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 mt-6 active:scale-95 active:opacity-90" type="submit">
                                Entrar
                            </button>
</form>
<div class="mt-6 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                                Ainda não tem acesso? <a class="font-headline-sm text-headline-sm text-primary hover:underline decoration-2 underline-offset-4" href="#">Fale com a secretaria</a>
</p>

</div>

<script>
        document.getElementById('togglePassword').addEventListener('click', function (e) {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('span');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        });
    </script>

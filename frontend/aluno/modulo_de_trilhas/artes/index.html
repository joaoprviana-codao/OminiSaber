<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Artes | EduTech</title>
    <link rel="stylesheet" href="style.css" />
    <script src="../../../backend/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../backend/supabase-client.js"></script>

  <body data-matter="Artes" data-mode="art">
    <header>
      <a href="../index.html">← Catálogo</a><strong>ARTES</strong

    </header>
    <main>
      <section class="hero">
        <small>LINGUAGENS / CRIAÇÃO</small>
        <h1>Veja<br />o processo.</h1>
        <p>
          Repertório visual, escolha e experimentação: crie sua própria leitura.
        </p>
        <strong data-progress>--%</strong>
      </section>
      <section class="canvas">
        <small>PALETA DE IDEIAS</small>
        <h2>Que atmosfera você quer criar?</h2>
        <div class="swatches">
          <button data-color="calma"></button
          ><button data-color="energia"></button
          ><button data-color="memoria"></button>
        </div>
        <div class="art-stage" data-stage>
          Selecione uma cor para iniciar sua composição.
        </div>
      </section>
      <section class="trails">
        <small>TRILHAS DE ARTES</small>
        <div data-trails>Carregando...</div>
      </section>
    </main>

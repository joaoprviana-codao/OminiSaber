<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geometria | EduTech</title>
    <link rel="stylesheet" href="style.css" />
    <script src="../../../backend/supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../../backend/supabase-client.js"></script>
    <script defer src="script.js"></script>
  </head>
  <body data-matter="Geometria">
    <header>
      <a href="../index.html">← Catálogo</a><strong>GEOMETRIA</strong
      ><a href="../../dashboard_principal/index.html">Dashboard ↗</a>
    </header>
    <main>
      <section class="hero">
        <small>MATEMÁTICA / ESPAÇO</small>
        <h1>Faça a forma<br />pensar.</h1>
        <p>
          Arraste medidas, compare áreas e descubra a lógica escondida nas
          figuras.
        </p>
        <strong data-progress>--%</strong>
      </section>
      <section class="shape">
        <div class="triangle" data-triangle></div>
        <div>
          <small>ESTÚDIO DE FORMAS</small>
          <h2>Triângulo ajustável</h2>
          <label
            >Base
            <input type="range" min="2" max="16" value="8" data-base /></label
          ><label
            >Altura <input type="range" min="2" max="16" value="6" data-height
          /></label>
          <p data-result>Área: 24 u²</p>
        </div>
      </section>
      <section class="trails">
        <small>TRILHAS DE GEOMETRIA</small>
        <div data-trails>Carregando...</div>
      </section>
    </main>
  </body>
</html>
